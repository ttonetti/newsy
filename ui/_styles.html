<style>
/* ── Design System — Newsy ──────────────────────────────────────────────────
   Inspired by Apple's HIG: ruthless simplicity, purposeful whitespace,
   information density without clutter.
   ────────────────────────────────────────────────────────────────────────── */

:root {
  /* Colors */
  --bg:            #F5F5F7;
  --surface:       #FFFFFF;
  --surface-2:     #FAFAFC;
  --border:        rgba(0,0,0,.08);
  --border-strong: rgba(0,0,0,.15);

  --text-primary:   #1D1D1F;
  --text-secondary: #6E6E73;
  --text-tertiary:  #98989D;
  --text-inverse:   #F5F5F7;

  --accent:        #0066CC;
  --accent-hover:  #004FA3;
  --accent-light:  #E8F2FF;
  --accent-dark:   #003D7A;

  --success:       #28CD41;
  --success-light: #E8F8EC;
  --warning:       #FF9500;
  --warning-light: #FFF4E0;
  --error:         #FF3B30;
  --error-light:   #FFE9E8;
  --info:          #5AC8FA;
  --info-light:    #EAF6FF;

  --nav-bg:        #1D1D1F;
  --nav-text:      rgba(255,255,255,.6);
  --nav-active:    #FFFFFF;
  --nav-hover:     rgba(255,255,255,.1);
  --nav-accent:    #0A84FF;

  /* Spacing */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-10: 40px;
  --space-12: 48px;

  /* Typography */
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;

  /* Radii */
  --r-sm:  6px;
  --r-md:  10px;
  --r-lg:  14px;
  --r-xl:  18px;
  --r-pill:100px;

  /* Shadows */
  --shadow-sm:  0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md:  0 4px 12px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.06);
  --shadow-lg:  0 8px 24px rgba(0,0,0,.10), 0 4px 8px rgba(0,0,0,.06);

  /* Transitions */
  --t-fast: 120ms ease;
  --t-base: 200ms ease;
  --t-slow: 350ms cubic-bezier(.25,.46,.45,.94);

  /* Layout */
  --nav-width:     220px;
  --nav-width-sm:  64px;
  --header-height: 56px;
  --content-max:   1140px;
}

/* ── Reset ──────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  color: var(--text-primary);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
img { max-width: 100%; height: auto; }
button { font-family: var(--font); cursor: pointer; }
input, select, textarea { font-family: var(--font); }

/* ── App Shell ──────────────────────────────────────────────────────────── */
.app-shell {
  display: flex;
  min-height: 100vh;
}

/* ── Sidebar Nav ────────────────────────────────────────────────────────── */
.sidebar {
  width: var(--nav-width);
  background: var(--nav-bg);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  transition: width var(--t-base);
  overflow: hidden;
}
.sidebar-logo {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-5) var(--space-5);
  border-bottom: 1px solid rgba(255,255,255,.06);
  min-height: var(--header-height);
}
.sidebar-logo-icon {
  width: 32px; height: 32px;
  background: var(--accent);
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 16px;
}
.sidebar-logo-name {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  color: var(--nav-active);
  letter-spacing: -.3px;
}
.sidebar-nav {
  flex: 1;
  padding: var(--space-3) var(--space-3);
  overflow-y: auto;
}
.nav-section-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  padding: var(--space-4) var(--space-3) var(--space-2);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: 9px var(--space-3);
  border-radius: var(--r-md);
  color: var(--nav-text);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background var(--t-fast), color var(--t-fast);
  white-space: nowrap;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}
.nav-item:hover { background: var(--nav-hover); color: var(--nav-active); }
.nav-item.active {
  background: rgba(255,255,255,.1);
  color: var(--nav-active);
}
.nav-item .nav-icon {
  width: 20px; height: 20px;
  flex-shrink: 0;
  opacity: .7;
  transition: opacity var(--t-fast);
}
.nav-item.active .nav-icon,
.nav-item:hover .nav-icon { opacity: 1; }
.nav-badge {
  margin-left: auto;
  background: var(--nav-accent);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: var(--r-pill);
  min-width: 20px;
  text-align: center;
}
.sidebar-footer {
  padding: var(--space-4);
  border-top: 1px solid rgba(255,255,255,.06);
}
.sidebar-user {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-2) var(--space-2);
  border-radius: var(--r-md);
  color: var(--nav-text);
  font-size: 13px;
}
.sidebar-user-avatar {
  width: 28px; height: 28px;
  background: var(--accent);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600;
  color: #fff; flex-shrink: 0;
}

/* ── Main Content ───────────────────────────────────────────────────────── */
.main-content {
  margin-left: var(--nav-width);
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.page-header {
  background: rgba(245,245,247,.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 var(--space-8);
  height: var(--header-height);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0; z-index: 50;
}
.page-title {
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -.3px;
}
.page-body {
  padding: var(--space-8);
  flex: 1;
  max-width: var(--content-max);
  width: 100%;
  margin: 0 auto;
}

/* ── View Pages (show/hide) ─────────────────────────────────────────────── */
.view { display: none; }
.view.active { display: block; }

/* ── Cards ──────────────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.card-header {
  padding: var(--space-5) var(--space-6);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-title {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.2px;
}
.card-body { padding: var(--space-6); }
.card-footer {
  padding: var(--space-4) var(--space-6);
  border-top: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: 0 0 var(--r-lg) var(--r-lg);
}

/* ── Stats Grid ─────────────────────────────────────────────────────────── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: var(--space-4);
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--space-5) var(--space-6);
  box-shadow: var(--shadow-sm);
}
.stat-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: var(--space-2);
}
.stat-value {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -.5px;
  color: var(--text-primary);
  line-height: 1;
}
.stat-meta {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-top: var(--space-1);
}

/* ── Newsletter Items ───────────────────────────────────────────────────── */
.newsletter-list { display: flex; flex-direction: column; gap: var(--space-2); }
.newsletter-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--space-4) var(--space-5);
  display: flex;
  align-items: flex-start;
  gap: var(--space-4);
  cursor: pointer;
  transition: border-color var(--t-fast), box-shadow var(--t-fast), transform var(--t-fast);
  text-decoration: none;
  color: inherit;
}
.newsletter-item:hover {
  border-color: var(--border-strong);
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
  text-decoration: none;
}
.newsletter-avatar {
  width: 40px; height: 40px;
  border-radius: var(--r-md);
  background: var(--accent-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
  color: var(--accent);
  font-weight: 600;
}
.newsletter-info { flex: 1; min-width: 0; }
.newsletter-source {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: .05em;
}
.newsletter-subject {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin: var(--space-1) 0;
}
.newsletter-meta {
  font-size: 12px;
  color: var(--text-tertiary);
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
.newsletter-date { flex-shrink: 0; }

/* ── Buttons ────────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  padding: 8px 16px;
  border-radius: var(--r-md);
  font-size: 14px;
  font-weight: 500;
  border: none;
  cursor: pointer;
  transition: background var(--t-fast), opacity var(--t-fast), transform var(--t-fast);
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: var(--accent-hover); color: #fff; text-decoration: none; }
.btn-secondary {
  background: var(--surface);
  color: var(--text-primary);
  border: 1px solid var(--border-strong);
}
.btn-secondary:hover { background: var(--bg); }
.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
}
.btn-ghost:hover { background: var(--border); color: var(--text-primary); }
.btn-danger {
  background: var(--error);
  color: #fff;
}
.btn-danger:hover { opacity: .85; color: #fff; text-decoration: none; }
.btn-sm { padding: 5px 12px; font-size: 13px; }
.btn-lg { padding: 12px 24px; font-size: 15px; font-weight: 600; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn-icon { padding: 8px; border-radius: var(--r-md); }

/* ── Forms ──────────────────────────────────────────────────────────────── */
.form-group { margin-bottom: var(--space-5); }
.form-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: var(--space-2);
}
.form-control {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--r-md);
  background: var(--surface);
  font-size: 14px;
  color: var(--text-primary);
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
  appearance: none;
}
.form-control:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,102,204,.12);
}
.form-control::placeholder { color: var(--text-tertiary); }
.form-hint { font-size: 12px; color: var(--text-tertiary); margin-top: var(--space-1); }
.form-error { font-size: 12px; color: var(--error); margin-top: var(--space-1); }

/* Password field */
.input-password-wrap { position: relative; }
.input-password-wrap .form-control { padding-right: 40px; }
.input-password-toggle {
  position: absolute; right: 10px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none;
  color: var(--text-tertiary); cursor: pointer; padding: 4px;
}

/* Select */
select.form-control {
  background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 7L11 1' stroke='%236E6E73' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 12px center;
  padding-right: 36px;
  cursor: pointer;
}

/* Checkbox / Radio */
.form-check {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  cursor: pointer;
  font-size: 14px;
}
.form-check input[type=checkbox],
.form-check input[type=radio] {
  width: 18px; height: 18px;
  margin-top: 1px;
  flex-shrink: 0;
  accent-color: var(--accent);
}

/* ── Badges ─────────────────────────────────────────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: 2px 8px;
  border-radius: var(--r-pill);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .02em;
  white-space: nowrap;
}
.badge-accent   { background: var(--accent-light);   color: var(--accent); }
.badge-success  { background: var(--success-light);  color: #1a7a2d; }
.badge-warning  { background: var(--warning-light);  color: #a85e00; }
.badge-error    { background: var(--error-light);    color: #c0281f; }
.badge-neutral  { background: var(--bg);             color: var(--text-secondary); border: 1px solid var(--border); }

/* ── Progress Bar ───────────────────────────────────────────────────────── */
.progress-wrap {
  background: var(--bg);
  border-radius: var(--r-pill);
  height: 6px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  border-radius: var(--r-pill);
  background: var(--accent);
  transition: width var(--t-slow);
}
.progress-bar.success { background: var(--success); }
.progress-bar.warning { background: var(--warning); }

/* ── Tags / Chips ───────────────────────────────────────────────────────── */
.tags { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px;
  background: var(--accent-light);
  color: var(--accent);
  border-radius: var(--r-pill);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: background var(--t-fast);
}
.tag:hover { background: rgba(0,102,204,.15); }
.tag.selected { background: var(--accent); color: #fff; }
.tag-remove { margin-left: 2px; opacity: .6; font-size: 14px; line-height: 1; }
.tag-remove:hover { opacity: 1; }

/* ── Alert / Toast ──────────────────────────────────────────────────────── */
.alert {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  padding: var(--space-4) var(--space-5);
  border-radius: var(--r-lg);
  font-size: 14px;
}
.alert-info    { background: var(--info-light);    border: 1px solid rgba(90,200,250,.3); color: #0a6492; }
.alert-success { background: var(--success-light); border: 1px solid rgba(40,205,65,.3);  color: #1a7a2d; }
.alert-warning { background: var(--warning-light); border: 1px solid rgba(255,149,0,.3);  color: #a85e00; }
.alert-error   { background: var(--error-light);   border: 1px solid rgba(255,59,48,.3);  color: #c0281f; }

#toast-container {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.toast {
  background: var(--nav-bg);
  color: var(--nav-active);
  padding: var(--space-3) var(--space-5);
  border-radius: var(--r-lg);
  font-size: 14px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  animation: slideUp 200ms ease forwards;
  max-width: 320px;
}
.toast.success { background: #1a7a2d; }
.toast.error   { background: var(--error); }
@keyframes slideUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Spinner ────────────────────────────────────────────────────────────── */
.spinner {
  width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 700ms linear infinite;
  flex-shrink: 0;
}
.spinner-sm { width: 14px; height: 14px; border-width: 1.5px; }
.spinner-lg { width: 32px; height: 32px; border-width: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Loading State ──────────────────────────────────────────────────────── */
.loading-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space-12) var(--space-8);
  gap: var(--space-4);
  color: var(--text-tertiary);
}

/* ── Empty State ────────────────────────────────────────────────────────── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space-12) var(--space-8);
  gap: var(--space-3);
  text-align: center;
}
.empty-icon {
  width: 48px; height: 48px;
  background: var(--border);
  border-radius: var(--r-xl);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  color: var(--text-tertiary);
}
.empty-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
.empty-desc  { font-size: 14px; color: var(--text-secondary); max-width: 320px; }

/* ── Divider ────────────────────────────────────────────────────────────── */
.divider {
  height: 1px;
  background: var(--border);
  margin: var(--space-5) 0;
}

/* ── Section Headings ───────────────────────────────────────────────────── */
.section-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: var(--space-4);
}
.section-title {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -.2px;
}
.section-action {
  font-size: 13px;
  font-weight: 500;
  color: var(--accent);
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
}

/* ── Status Dot ─────────────────────────────────────────────────────────── */
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.status-dot.online  { background: var(--success); box-shadow: 0 0 0 2px var(--success-light); }
.status-dot.offline { background: var(--error);   box-shadow: 0 0 0 2px var(--error-light); }
.status-dot.warning { background: var(--warning); box-shadow: 0 0 0 2px var(--warning-light); }
.status-dot.idle    { background: var(--text-tertiary); }
.status-row {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3) 0;
  font-size: 14px;
}
.status-row + .status-row { border-top: 1px solid var(--border); }
.status-label { flex: 1; }
.status-value { font-size: 13px; color: var(--text-secondary); }

/* ── Pagination ─────────────────────────────────────────────────────────── */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  padding: var(--space-6) 0;
}
.page-btn {
  min-width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  font-size: 13px;
  background: var(--surface);
  color: var(--text-primary);
  cursor: pointer;
  transition: background var(--t-fast), border-color var(--t-fast);
}
.page-btn:hover { background: var(--bg); border-color: var(--border-strong); }
.page-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.page-btn[disabled] { opacity: .4; pointer-events: none; }

/* ── Search ─────────────────────────────────────────────────────────────── */
.search-wrap {
  position: relative;
  width: 100%;
}
.search-icon {
  position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-tertiary);
  pointer-events: none;
}
.search-input {
  width: 100%;
  padding: 10px 12px 10px 38px;
  border: 1px solid var(--border-strong);
  border-radius: var(--r-md);
  background: var(--surface);
  font-size: 15px;
  color: var(--text-primary);
